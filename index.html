<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Cross-origin isolation shim: injects COOP/COEP headers via a service worker so
     SharedArrayBuffer works (needed by Pyodide/pandas) on static hosts like GitHub
     Pages. Must load first. See https://github.com/gzuidhof/coi-serviceworker -->
<script src="coi-serviceworker.min.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python Dictionary</title>
<style>
  /* ---------- Theme ---------- */
  :root{
    --bg:#ffffff;
    --text:#1f2328;
    --muted:#59636e;
    --faint:#818b98;
    --border:#e1e4e8;
    --border-strong:#d0d7de;
    --surface:#f6f8fa;
    --surface-2:#eef1f4;
    --accent:#007acc;          /* VSCode blue */
    --accent-soft:#e7f2fb;
    --danger:#cf222e;
    --ok:#1a7f37;
    --chip:#eef1f4;
    --code-bg:#f6f8fa;
    --mono: Consolas, "Cascadia Code", "Cascadia Mono", "Courier New", monospace;
    --sans: "Segoe UI", system-ui, -apple-system, sans-serif;
    --side: 280px;             /* sidebar width — the search bar aligns to this edge */
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:var(--sans); font-size:14px; line-height:1.5;
    display:flex; flex-direction:column;
  }
  button{font-family:inherit}
  code,pre,textarea.code,.mono{font-family:var(--mono)}

  /* ---------- Top bar ---------- */
  .topbar{
    display:flex; align-items:center; gap:12px;
    padding:10px 16px; border-bottom:1px solid var(--border);
    flex:0 0 auto;
  }
  /* Fixed width so the search bar's left edge lines up with the main panel
     (sidebar width, less the topbar's left padding and the flex gap). */
  .brand{
    font-weight:600; font-size:15px; white-space:nowrap;
    flex:0 0 calc(var(--side) - 16px - 12px); overflow:hidden; text-overflow:ellipsis;
  }
  .search-wrap{flex:1 1 auto; position:relative; max-width:640px}
  .search-wrap input{
    width:100%; padding:8px 12px 8px 34px; border:1px solid var(--border-strong);
    border-radius:8px; font-size:14px; font-family:inherit; background:var(--bg); color:var(--text);
  }
  .search-wrap input:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
  .search-wrap .icon{position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--faint); pointer-events:none}
  .topbar .spacer{flex:1 1 auto}
  .btn{
    border:1px solid var(--border-strong); background:var(--bg); color:var(--text);
    padding:7px 12px; border-radius:8px; cursor:pointer; font-size:13px; white-space:nowrap;
    display:inline-flex; align-items:center; gap:6px;
  }
  .btn:hover{background:var(--surface)}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff}
  .btn.primary:hover{background:#0a6cb4}
  .btn.subtle{border-color:transparent; color:var(--muted)}
  .btn.subtle:hover{background:var(--surface)}
  .btn.danger{color:var(--danger); border-color:var(--border-strong)}
  .btn.danger:hover{background:#fdeff0; border-color:var(--danger)}
  .btn.tiny{padding:4px 9px; font-size:12px}
  .btn.run{background:var(--accent); color:#fff; border-color:var(--accent); padding:5px 12px}
  .btn.run:hover{background:#0a6cb4}

  .file-status{font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px; white-space:nowrap}
  .dot{width:8px; height:8px; border-radius:50%; background:var(--faint)}
  .dot.saved{background:var(--ok)}
  .dot.unsaved{background:#d4a72c}
  .dot.none{background:var(--faint)}

  /* ---------- Session setup dropdown ---------- */
  .setup-dropdown{
    position:fixed; z-index:60; background:#fff; border:1px solid var(--border-strong);
    border-radius:10px; box-shadow:0 10px 32px rgba(0,0,0,.18); padding:12px; width:min(560px,92vw); display:none;
  }
  .setup-dropdown.show{display:block}
  .setup-dd-head{display:flex; align-items:center; gap:10px; margin-bottom:8px}
  .setup-title{font-weight:600; font-size:12.5px; flex:0 0 auto}
  .setup-sub{color:var(--muted); font-size:11.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1 1 auto}
  .setup-dd-head .btn.run{flex:0 0 auto}
  .setup-dropdown textarea.code{
    width:100%; border:1px solid var(--border); border-radius:8px; background:#fff; color:var(--text);
    padding:10px 12px; font-size:13px; line-height:1.55; resize:none; min-height:88px; tab-size:4; display:block;
  }
  .setup-dropdown textarea.code:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
  .setup-out{display:none; margin-top:8px; border:1px solid var(--border); border-radius:8px; background:#fbfdff; overflow:hidden}
  .setup-out.show{display:block}
  .setup-out .out-label{font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--faint); padding:8px 12px 2px}
  .setup-out pre{margin:0; padding:2px 12px 12px; font-family:var(--mono); font-size:12.5px; white-space:pre-wrap; word-break:break-word; overflow-x:auto}
  .setup-out pre.err{color:var(--danger)}

  /* ---------- Body layout ---------- */
  .main{display:flex; flex:1 1 auto; min-height:0}
  .sidebar{
    width:var(--side); flex:0 0 var(--side); border-right:1px solid var(--border);
    overflow-y:auto; padding:10px 8px 40px; background:var(--bg);
  }
  .sidebar .side-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:4px 8px 8px; color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.04em; font-weight:600;
  }
  .side-head-right{display:flex; align-items:center; gap:6px}
  .collapse-all{
    width:20px; height:20px; padding:0; flex:0 0 20px; gap:3px;
    border:1px solid var(--border-strong); border-radius:4px;
    background:var(--bg); color:var(--muted); cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    line-height:1; font-size:7px;
  }
  .collapse-all.expand{gap:1px}   /* arrows point apart — sit them closer */
  .collapse-all:hover{background:var(--surface); color:var(--text); border-color:var(--faint)}
  .cat-group{margin-bottom:2px}
  .cat-header{
    display:flex; align-items:center; gap:6px; padding:6px 8px; cursor:pointer;
    border-radius:6px; color:var(--text); font-weight:600; font-size:13px; user-select:none;
  }
  .cat-header:hover{background:var(--surface)}
  .cat-header .caret{transition:transform .12s; color:var(--faint); font-size:10px; width:12px; text-align:center}
  .cat-header.collapsed .caret{transform:rotate(-90deg)}
  .cat-header .cat-name{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .cat-header .count{margin-left:auto; color:var(--faint); font-size:11px; font-weight:500}
  .cat-rename{
    border:none; background:none; cursor:pointer; color:var(--faint); font-size:12px; padding:2px 4px;
    border-radius:4px; opacity:0; transition:opacity .1s; flex:0 0 auto;
  }
  .cat-header:hover .cat-rename{opacity:1}
  .cat-rename:hover{background:var(--surface-2); color:var(--accent)}
  .fn-list{padding:2px 0 6px 8px}
  .fn-item{
    display:block; padding:5px 8px 5px 14px; border-radius:6px; cursor:pointer;
    font-family:var(--mono); font-size:12.5px; color:var(--text);
    border-left:2px solid transparent; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .fn-item:hover{background:var(--surface)}
  .fn-item.active{background:var(--accent-soft); border-left-color:var(--accent); color:var(--accent)}
  .empty-side{padding:16px 10px; color:var(--faint); font-size:12.5px; line-height:1.6}

  /* ---------- Content panel ---------- */
  .content{flex:1 1 auto; overflow-y:auto; padding:0}
  .content-inner{max-width:900px; margin:0 auto; padding:28px 32px 80px}

  .empty-state{max-width:640px; margin:8vh auto; text-align:center; color:var(--muted); padding:0 20px}
  .empty-state h1{font-size:22px; color:var(--text); margin:0 0 8px}
  .empty-state p{margin:6px 0}
  .empty-state .cta{margin-top:22px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap}

  /* function detail */
  .fn-name{font-family:var(--mono); font-size:24px; font-weight:600; color:var(--text); word-break:break-word}
  .fn-topline{display:flex; align-items:flex-start; gap:12px; flex-wrap:wrap}
  .fn-topline .grow{flex:1 1 auto; min-width:200px}
  .fn-actions{display:flex; gap:8px; flex:0 0 auto}
  .chips{display:flex; gap:6px; flex-wrap:wrap; margin-top:10px}
  .chip{background:var(--chip); color:var(--muted); border-radius:20px; padding:3px 11px; font-size:12px}
  .chip.cat{background:var(--accent-soft); color:var(--accent); font-weight:600}
  .chip.kw{font-family:var(--mono); font-size:11.5px}

  .section{margin-top:26px}
  .section > h3{
    font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted);
    margin:0 0 10px; font-weight:600;
  }
  .desc{font-size:14.5px; line-height:1.65; white-space:pre-wrap}
  .syntax-block{
    background:var(--code-bg); border:1px solid var(--border); border-radius:8px;
    padding:12px 14px; font-family:var(--mono); font-size:13px; white-space:pre-wrap; overflow-x:auto; color:var(--text);
  }

  /* examples */
  .example{border:1px solid var(--border); border-radius:10px; overflow:hidden; margin-bottom:16px; background:var(--bg)}
  .example .ex-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:8px 12px; background:var(--surface); border-bottom:1px solid var(--border);
    font-size:12px; color:var(--muted);
  }
  .example .ex-head .ex-title{font-weight:600; color:var(--text)}
  .example .ex-note{padding:9px 14px; font-size:13px; color:var(--muted); border-bottom:1px dashed var(--border); white-space:pre-wrap}
  textarea.code{
    width:100%; border:none; resize:none; padding:12px 14px; font-size:13px; line-height:1.55;
    background:var(--bg); color:var(--text); display:block; min-height:44px; tab-size:4;
  }
  textarea.code:focus{outline:none; background:#fbfdff}
  .ex-toolbar{
    display:flex; align-items:center; gap:8px; padding:8px 12px; border-top:1px solid var(--border);
    background:var(--surface); font-size:12px;
  }
  .ex-toolbar .runhint{color:var(--faint); margin-left:auto}
  .ex-output{border-top:1px solid var(--border); background:#fbfdff; padding:0; display:none}
  .ex-output.show{display:block}
  .ex-output .out-label{
    font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--faint); padding:8px 14px 2px;
  }
  .ex-output pre{
    margin:0; padding:4px 14px 14px; font-family:var(--mono); font-size:12.5px;
    white-space:pre-wrap; word-break:break-word; color:var(--text); overflow-x:auto;
  }
  .ex-output pre.err{color:var(--danger)}

  /* ---------- Modal / form ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(27,31,36,.45); display:none;
    align-items:flex-start; justify-content:center; z-index:50; padding:5vh 16px; overflow-y:auto;
  }
  .overlay.show{display:flex}
  .modal{
    background:var(--bg); border-radius:12px; width:100%; max-width:720px; box-shadow:0 12px 48px rgba(0,0,0,.24);
    border:1px solid var(--border);
  }
  .modal .m-head{display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--border)}
  .modal .m-head h2{margin:0; font-size:16px}
  .modal .m-body{padding:18px 20px; max-height:70vh; overflow-y:auto}
  .modal .m-foot{display:flex; justify-content:space-between; gap:10px; padding:14px 20px; border-top:1px solid var(--border); align-items:center}
  .field{margin-bottom:16px}
  .field label{display:block; font-size:12.5px; font-weight:600; color:var(--text); margin-bottom:5px}
  .field .hint{font-weight:400; color:var(--faint); font-size:11.5px}
  .field input[type=text], .field textarea, .field select{
    width:100%; padding:8px 10px; border:1px solid var(--border-strong); border-radius:7px;
    font-family:inherit; font-size:13.5px; background:var(--bg); color:var(--text);
  }
  .field textarea{resize:vertical}
  .field input:focus, .field textarea:focus, .field select:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
  .field .mono, .field textarea.code-in, .field input.mono{font-family:var(--mono)}
  .ex-editor{border:1px solid var(--border); border-radius:9px; padding:12px; margin-bottom:12px; background:var(--surface)}
  .ex-editor .ex-editor-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; font-size:12.5px; font-weight:600; color:var(--muted)}
  .close-x{border:none; background:none; font-size:20px; cursor:pointer; color:var(--faint); line-height:1; padding:2px 6px}
  .close-x:hover{color:var(--text)}
  .modal-error{color:var(--danger); font-size:12.5px}

  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:#1f2328; color:#fff; padding:10px 16px; border-radius:8px; font-size:13px;
    opacity:0; pointer-events:none; transition:opacity .2s; z-index:100; max-width:80vw; text-align:center;
  }
  .toast.show{opacity:1}

  /* pyodide loading banner */
  .py-banner{
    display:none; align-items:center; gap:10px; background:var(--accent-soft); color:var(--accent);
    padding:8px 14px; font-size:12.5px; border-bottom:1px solid #cfe6f7;
  }
  .py-banner.show{display:flex}
  .spinner{width:14px; height:14px; border:2px solid #b8dcf5; border-top-color:var(--accent); border-radius:50%; animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  .kb{font-family:var(--mono); background:var(--surface); border:1px solid var(--border); border-radius:5px; padding:1px 6px; font-size:12px}
  a{color:var(--accent)}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">Python Dictionary</div>
  <div class="search-wrap">
    <span class="icon">🔍</span>
    <input id="search" type="text" placeholder="Search Dictionary" autocomplete="off" spellcheck="false">
  </div>
  <button class="btn primary" id="addBtn">＋ New function</button>
  <div class="spacer"></div>
  <div class="file-status" id="fileStatus"><span class="dot none"></span><span id="fileStatusText">No library file</span></div>
  <button class="btn" id="setupBtn" title="Session setup — run imports / load data once per session">▶ Setup</button>
  <button class="btn" id="dataBtn" title="Mount a folder of datasets so examples can read /data/yourfile.csv">📁 Data</button>
  <input type="file" id="dataFiles" multiple style="display:none">
  <button class="btn" id="fileBtn" title="Open or create your library file">📂 Library</button>
</div>

<div class="py-banner" id="pyBanner"><span class="spinner"></span><span id="pyBannerText">Loading Python (numpy + pandas)… first time only.</span></div>

<!-- Session setup dropdown (opened from the top ribbon): state is shared by every example -->
<div id="setupDropdown" class="setup-dropdown">
  <div class="setup-dd-head">
    <span class="setup-title">Session setup</span>
    <span class="setup-sub">runs once per session — then every example can use it</span>
    <button class="btn run tiny" id="setupRunBtn">▶ Run</button>
  </div>
  <textarea class="code" id="setupCode" spellcheck="false" placeholder="import pandas as pd&#10;import numpy as np&#10;iris = pd.read_csv('/data/Iris.csv')"></textarea>
  <div class="setup-out" id="setupOut"><div class="out-label">Output</div><pre></pre></div>
</div>

<div class="main">
  <aside class="sidebar" id="sidebar"></aside>
  <section class="content" id="content"></section>
</div>

<!-- Add / Edit modal -->
<div class="overlay" id="formOverlay">
  <div class="modal">
    <div class="m-head">
      <h2 id="formTitle">New function</h2>
      <button class="close-x" data-close-form>&times;</button>
    </div>
    <div class="m-body">
      <div class="field">
        <label>Function name <span class="hint">— exactly how you call it, e.g. <span class="mono">pandas.DataFrame.mean</span> or <span class="mono">np.mean</span></span></label>
        <input type="text" id="f_name" class="mono" placeholder="pd.DataFrame.mean" spellcheck="false">
      </div>
      <div class="field">
        <label>Category <span class="hint">— pick existing or type a new one</span></label>
        <input type="text" id="f_category" list="catList" placeholder="e.g. Aggregation / Stats" spellcheck="false">
        <datalist id="catList"></datalist>
      </div>
      <div class="field">
        <label>Syntax / signature <span class="hint">— shown first in the entry</span></label>
        <textarea id="f_syntax" class="code-in" rows="2" placeholder="DataFrame.mean(axis=0, skipna=True, numeric_only=False)" spellcheck="false"></textarea>
      </div>
      <div class="field">
        <label>Description / explanation</label>
        <textarea id="f_desc" rows="3" placeholder="What it does, in your own words." spellcheck="true"></textarea>
      </div>
      <div class="field">
        <label>Keywords <span class="hint">— comma separated; powers "search what I want to do" (e.g. average, central tendency)</span></label>
        <input type="text" id="f_keywords" placeholder="average, central tendency, summary stat" spellcheck="false">
      </div>

      <div class="field">
        <label>Examples <span class="hint">— each is runnable &amp; editable later</span></label>
        <div id="exEditors"></div>
        <button class="btn tiny" id="addExampleBtn" type="button">＋ Add example</button>
      </div>
      <div class="modal-error" id="formError"></div>
    </div>
    <div class="m-foot">
      <button class="btn danger" id="deleteFnBtn" style="display:none">Delete</button>
      <div style="flex:1 1 auto"></div>
      <button class="btn" data-close-form>Cancel</button>
      <button class="btn primary" id="saveFnBtn">Save function</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   Python Dictionary — a personal, searchable, runnable function reference.
   Single self-contained file. Your data lives in a JSON file you own.
   ===================================================================== */

/* ---------------------------------------------------------------------
   1. STATE
   --------------------------------------------------------------------- */
const state = {
  library: { language:'python', version:1, functions:[], setup:'' },
  fileHandle: null,           // FileSystemFileHandle when auto-saving to disk
  dirty: false,
  currentId: null,
  collapsed: {},              // category -> collapsed?
  pyodide: null,
  pyLoading: null,
  editing: null,              // function id being edited, or null for "new"
  formExamples: [],           // working copy of examples in the form
  dataDirHandle: null,        // chosen datasets folder
  dataMounted: null,          // name of folder mounted at /data
};

const LS_KEY = 'pydict.library.backup';

/* ---------------------------------------------------------------------
   2. INTENT SYNONYMS  (powers "search what I want to do")
   --------------------------------------------------------------------- */
const SYNONYMS = {
  average:['mean','median','mode'], avg:['mean'], mean:['mean'],
  middle:['median'], spread:['std','var'], deviation:['std'], dispersion:['std','var'],
  frequency:['value_counts','count'], count:['count','value_counts'], distinct:['unique','nunique'],
  group:['groupby'], aggregate:['agg','groupby'], summarise:['describe','agg'], summarize:['describe','agg'],
  filter:['query','loc','isin','where'], select:['loc','iloc','query'], subset:['loc','iloc','query'],
  missing:['isna','fillna','dropna'], null:['isna','fillna','dropna'], nan:['isna','fillna'],
  join:['merge','join','concat'], combine:['merge','concat'], reshape:['pivot','melt','stack'],
  sort:['sort_values','sort_index'], rank:['rank'], top:['nlargest'], bottom:['nsmallest'],
  largest:['nlargest'], smallest:['nsmallest'],
  loop:['for','enumerate','map'], iterate:['enumerate','zip','map'],
  text:['str.contains','str.replace','str.split'], string:['str.contains','str.split'],
  date:['to_datetime','date_range'], time:['to_datetime','resample'],
  load:['read_csv','read_excel'], save:['to_csv','to_excel'], read:['read_csv'], write:['to_csv'],
  create:['DataFrame','Series','array'], make:['DataFrame','array'], random:['random.rand','random.randn'],
};

/* ---------------------------------------------------------------------
   3. UTILITIES
   --------------------------------------------------------------------- */
const $ = sel => document.querySelector(sel);
const $$ = sel => Array.from(document.querySelectorAll(sel));
const uid = () => 'f' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
function esc(s){ return String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function lastSeg(name){ return String(name||'').split(/[.\(]/).filter(Boolean).pop()?.toLowerCase().trim() || ''; }
function tokens(s){ return String(s||'').toLowerCase().split(/[^a-z0-9_.]+/).filter(Boolean); }

let toastTimer;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove('show'), 2400);
}

/* ---------------------------------------------------------------------
   4. PERSISTENCE  (File System Access API + localStorage backup)
   --------------------------------------------------------------------- */
const canFS = 'showOpenFilePicker' in window;

function idb(){
  return new Promise((res,rej)=>{
    const r = indexedDB.open('pydict', 1);
    r.onupgradeneeded = ()=> r.result.createObjectStore('kv');
    r.onsuccess = ()=> res(r.result);
    r.onerror = ()=> rej(r.error);
  });
}
async function idbSet(k,v){ const db=await idb(); return new Promise((res,rej)=>{const tx=db.transaction('kv','readwrite'); tx.objectStore('kv').put(v,k); tx.oncomplete=res; tx.onerror=()=>rej(tx.error);}); }
async function idbGet(k){ const db=await idb(); return new Promise((res,rej)=>{const tx=db.transaction('kv','readonly'); const rq=tx.objectStore('kv').get(k); rq.onsuccess=()=>res(rq.result); rq.onerror=()=>rej(rq.error);}); }

async function verifyPermission(handle, request){
  const opts = { mode:'readwrite' };
  if(await handle.queryPermission(opts) === 'granted') return true;
  if(request && await handle.requestPermission(opts) === 'granted') return true;
  return false;
}

function setFileStatus(kind, text){
  $('#fileStatus .dot').className = 'dot ' + kind;
  $('#fileStatusText').textContent = text;
}

let saveTimer;
function scheduleSave(){
  state.dirty = true;
  if(state.fileHandle) setFileStatus('unsaved','Saving…');
  localStorage.setItem(LS_KEY, JSON.stringify(state.library)); // always keep a backup
  clearTimeout(saveTimer);
  saveTimer = setTimeout(commitSave, 400);
}
async function commitSave(){
  if(!state.fileHandle){
    state.dirty = false;
    setFileStatus('none', '');
    return;
  }
  try{
    const w = await state.fileHandle.createWritable();
    await w.write(JSON.stringify(state.library, null, 2));
    await w.close();
    state.dirty = false;
    setFileStatus('saved', 'Saved · ' + (state.fileHandle.name||'library.json'));
  }catch(err){
    setFileStatus('unsaved','Save failed — ' + err.message);
    toast('Could not write file: ' + err.message);
  }
}

async function openLibraryFile(){
  if(canFS){
    let handle;
    try{ [handle] = await window.showOpenFilePicker({ types:[{description:'Python Dictionary', accept:{'application/json':['.json']}}] }); }
    catch(e){ return; }
    if(!(await verifyPermission(handle, true))){ toast('Permission denied'); return; }
    await loadFromText(await (await handle.getFile()).text());
    state.fileHandle = handle;
    await idbSet('handle', handle);
    setFileStatus('saved','Opened · ' + handle.name);
    toast('Loaded ' + state.library.functions.length + ' function(s)');
  } else {
    const inp = document.createElement('input');
    inp.type='file'; inp.accept='.json,application/json';
    inp.onchange = async () => { const f = inp.files[0]; if(f){ await loadFromText(await f.text()); toast('Imported ' + state.library.functions.length + ' function(s)'); } };
    inp.click();
  }
}

async function newLibraryFile(){
  if(canFS){
    let handle;
    try{ handle = await window.showSaveFilePicker({ suggestedName:'python-dictionary.json', types:[{description:'Python Dictionary', accept:{'application/json':['.json']}}] }); }
    catch(e){ return; }
    if(!(await verifyPermission(handle, true))){ toast('Permission denied'); return; }
    state.fileHandle = handle;
    await idbSet('handle', handle);
    await commitSave();
    setFileStatus('saved','New file · ' + handle.name);
    toast('Created ' + handle.name);
  } else {
    exportLibrary();
  }
}

function exportLibrary(){
  const blob = new Blob([JSON.stringify(state.library,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'python-dictionary.json'; a.click();
  URL.revokeObjectURL(a.href);
  toast('Downloaded python-dictionary.json');
}

async function loadFromText(text){
  try{
    const data = JSON.parse(text);
    if(!data || !Array.isArray(data.functions)) throw new Error('Not a valid library file');
    state.library = Object.assign({language:'python', version:1, functions:[], setup:''}, data);
    localStorage.setItem(LS_KEY, JSON.stringify(state.library));
    state.currentId = state.library.functions[0]?.id || null;
    renderAll();
  }catch(err){ toast('Load failed: ' + err.message); }
}

async function tryRestoreHandle(){
  if(!canFS) return false;
  try{
    const handle = await idbGet('handle');
    if(!handle) return false;
    if(await handle.queryPermission({mode:'readwrite'}) === 'granted'){
      await loadFromText(await (await handle.getFile()).text());
      state.fileHandle = handle;
      setFileStatus('saved','Reopened · ' + handle.name);
      return true;
    } else {
      state._pendingHandle = handle; // needs a click to re-grant
    }
  }catch(e){/* ignore */}
  return false;
}
async function reopenPending(){
  const handle = state._pendingHandle; if(!handle) return;
  if(await verifyPermission(handle, true)){
    await loadFromText(await (await handle.getFile()).text());
    state.fileHandle = handle; state._pendingHandle = null;
    setFileStatus('saved','Reopened · ' + handle.name);
    toast('Reopened ' + handle.name);
  }
}

/* ---------------------------------------------------------------------
   5. SEARCH  (by name AND by intent via keywords + synonyms)
   --------------------------------------------------------------------- */
function matchScore(fn, q){
  if(!q) return 1;
  const query = q.toLowerCase().trim();
  const qTokens = tokens(query);
  const expanded = new Set(qTokens);
  qTokens.forEach(t => (SYNONYMS[t]||[]).forEach(s => expanded.add(s.toLowerCase())));

  const name = (fn.name||'').toLowerCase();
  const seg = lastSeg(fn.name);
  const kw = (fn.keywords||[]).join(' ').toLowerCase();
  const cat = (fn.category||'').toLowerCase();
  const hay = name+' '+kw+' '+cat;   // description is deliberately NOT searched

  let score = 0;
  if(name.includes(query)) score += 10;
  if(seg && seg.startsWith(query)) score += 6;
  if(kw.includes(query)) score += 5;
  if(cat.includes(query)) score += 2;
  for(const t of expanded){
    if(!t) continue;
    if(seg === t) score += 8;
    else if(name.includes(t)) score += 4;
    else if(kw.includes(t)) score += 4;
    else if(hay.includes(t)) score += 1;
  }
  return score;
}
function currentQuery(){ return $('#search').value.trim(); }

/* ---------------------------------------------------------------------
   6. RENDERING
   --------------------------------------------------------------------- */
function categoriesFrom(functions){
  const map = new Map();
  functions.forEach(fn => {
    const c = fn.category?.trim() || 'Uncategorised';
    if(!map.has(c)) map.set(c, []);
    map.get(c).push(fn);
  });
  return Array.from(map.entries())
    .sort((a,b)=> a[0].localeCompare(b[0]))
    .map(([cat, fns]) => [cat, fns.sort((x,y)=> (x.name||'').localeCompare(y.name||''))]);
}

function renderSidebar(){
  const side = $('#sidebar');
  const q = currentQuery();
  let fns = state.library.functions;
  if(q){
    fns = fns.map(f => [f, matchScore(f,q)]).filter(([,s]) => s>0).sort((a,b)=> b[1]-a[1]).map(([f])=>f);
  }
  if(state.library.functions.length === 0){
    side.innerHTML = `<div class="empty-side">Your library is empty.<br><br>Click <b>＋ New function</b> to add your first entry — you're in full control of everything that goes in.</div>`;
    return;
  }
  if(fns.length === 0){
    side.innerHTML = `<div class="side-head"><span>Categories</span></div><div class="empty-side">No matches for “${esc(q)}”.</div>`;
    return;
  }
  const cats = categoriesFrom(fns);
  // Collapse/expand-all toggle — hidden while searching (search force-expands everything).
  const allCollapsed = cats.length > 0 && cats.every(([c]) => state.collapsed[c]);
  const toggleBtn = q ? '' :
    `<button class="collapse-all${allCollapsed?' expand':''}" id="collapseAll" title="${allCollapsed?'Expand all categories':'Collapse all categories'}">
       <span>${allCollapsed?'⌃':'⌄'}</span><span>${allCollapsed?'⌄':'⌃'}</span>
     </button>`;
  let html = `<div class="side-head"><span>Categories</span><span class="side-head-right">${toggleBtn}<span>${fns.length}</span></span></div>`;
  for(const [cat, list] of cats){
    const collapsed = state.collapsed[cat] && !q; // search auto-expands
    html += `<div class="cat-group">
      <div class="cat-header ${collapsed?'collapsed':''}" data-cat="${esc(cat)}">
        <span class="caret">▼</span>
        <span class="cat-name">${esc(cat)}</span>
        <button class="cat-rename" data-rename="${esc(cat)}" title="Rename this category">✎</button>
        <span class="count">${list.length}</span>
      </div>
      <div class="fn-list" style="${collapsed?'display:none':''}">
        ${list.map(fn => `<div class="fn-item ${fn.id===state.currentId?'active':''}" data-id="${fn.id}" title="${esc(fn.name)}">${esc(fn.name)}</div>`).join('')}
      </div>
    </div>`;
  }
  side.innerHTML = html;
}

function exampleHtml(fnId, ex, i){
  return `<div class="example" data-ex="${i}">
    <div class="ex-head"><span class="ex-title">Example ${i+1}</span></div>
    ${ex.note ? `<div class="ex-note">${esc(ex.note)}</div>` : ''}

    <div class="ex-toolbar">
      <button class="btn run tiny" data-run="${i}">▶ Run</button>
      <button class="btn tiny" data-savecode="${i}" title="Save edits to this example">💾 Save code</button>
      <span class="runhint">Ctrl+Enter to run</span>
    </div>
    <div class="ex-output" data-out="${i}">
      <div class="out-label">Output</div>
      <pre></pre>
    </div>
  </div>`;
}

function autosize(ta){ ta.style.height='auto'; ta.style.height = Math.min(ta.scrollHeight, 600) + 'px'; }

function wireExample(fnId, i){
  const ex = document.querySelector(`.example[data-ex="${i}"]`);
  if(!ex) return;
  const ta = ex.querySelector('textarea.code');
  autosize(ta);
  ta.addEventListener('input', ()=>autosize(ta));
  ta.addEventListener('keydown', e=>{
    if(e.key==='Enter' && (e.ctrlKey||e.metaKey)){ e.preventDefault(); runExample(fnId, i); }
    if(e.key==='Tab'){ e.preventDefault(); const s=ta.selectionStart, en=ta.selectionEnd; ta.value = ta.value.slice(0,s) + '    ' + ta.value.slice(en); ta.selectionStart = ta.selectionEnd = s+4; }
  });
  ex.querySelector(`[data-run="${i}"]`).onclick = ()=>runExample(fnId, i);
  ex.querySelector(`[data-savecode="${i}"]`).onclick = ()=>{
    const fn = state.library.functions.find(f=>f.id===fnId);
    fn.examples[i].code = ta.value; fn.updatedAt = Date.now();
    scheduleSave(); toast('Example code saved');
  };
}

function renderSetup(){
  const ta = $('#setupCode');
  if(ta.value !== (state.library.setup||'')) ta.value = state.library.setup || '';

/* ---------------------------------------------------------------------
   7. PYODIDE  (one shared session for the whole app)
   --------------------------------------------------------------------- */
function loadScript(src){
  return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>rej(new Error('Failed to load '+src)); document.head.appendChild(s); });
}
async function ensurePyodide(){
  if(state.pyodide) return state.pyodide;
  if(state.pyLoading) return state.pyLoading;
  const banner = $('#pyBanner'); banner.classList.add('show');
  state.pyLoading = (async ()=>{
    try{
      if(!window.loadPyodide){ await loadScript('https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js'); }
      $('#pyBannerText').textContent = 'Starting Python…';
      const py = await loadPyodide({ indexURL:'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/' });
      $('#pyBannerText').textContent = 'Loading numpy + pandas…';
      await py.loadPackage(['numpy','pandas']);
      state.pyodide = py;
      await autoMountData(py);   // silently re-attach a previously chosen data folder, if still permitted
      banner.classList.remove('show');
      return py;
    }catch(err){
      $('#pyBannerText').textContent = 'Python failed to load — need internet on first run. (' + err.message + ')';
      setTimeout(()=>banner.classList.remove('show'), 4000);
      throw err;
    }
  })();
  return state.pyLoading;
}

// Run code in the shared session; returns {text, err}. Globals persist across calls.
async function runPython(code){
  let py;
  try{ py = await ensurePyodide(); }
  catch(e){ return { text:'⚠ ' + e.message, err:true }; }
  let out = '';
  py.setStdout({ batched: s => { out += s + '\n'; } });
  py.setStderr({ batched: s => { out += s + '\n'; } });
  try{
    const result = await py.runPythonAsync(code);
    let tail = '';
    if(result !== undefined && result !== null){
      try{ tail = result.toString(); }catch(_){ tail=''; }
      if(result && typeof result.destroy === 'function') result.destroy();
    }
    const combined = (out + (tail ? ((out && !out.endsWith('\n'))?'\n':'') + tail : '')).replace(/\n+$/,'');
    return { text: combined === '' ? '✓ ran with no output' : combined, err:false };
  }catch(err){
    return { text: (out ? out + '\n' : '') + String(err.message||err).split('\n').slice(-8).join('\n'), err:true };
  }finally{
    py.setStdout({}); py.setStderr({});
  }
}

async function runExample(fnId, i){
  const ex = document.querySelector(`.example[data-ex="${i}"]`);
  const ta = ex.querySelector('textarea.code');
  const outBox = ex.querySelector(`[data-out="${i}"]`);
  const pre = outBox.querySelector('pre');
  const runBtn = ex.querySelector(`[data-run="${i}"]`);
  outBox.classList.add('show'); pre.classList.remove('err'); pre.textContent = '⏳ running…';
  runBtn.disabled = true;
  const res = await runPython(ta.value);
  pre.classList.toggle('err', res.err); pre.textContent = res.text;
  runBtn.disabled = false;
}

function toggleSetupDropdown(anchor){
  const dd = $('#setupDropdown');
  if(dd.classList.contains('show')){ dd.classList.remove('show'); return; }
  const r = anchor.getBoundingClientRect();
  const w = Math.min(560, window.innerWidth*0.92);
  dd.style.top = (r.bottom + 6) + 'px';
  dd.style.left = Math.max(8, Math.min(r.left, window.innerWidth - w - 8)) + 'px';
  dd.classList.add('show');
  autosize($('#setupCode'));
  $('#setupCode').focus();
  setTimeout(()=>{
    const off = (ev)=>{ if(!dd.contains(ev.target) && ev.target!==anchor && !anchor.contains(ev.target)){ dd.classList.remove('show'); document.removeEventListener('mousedown', off); } };
    document.addEventListener('mousedown', off);
  }, 0);
}
async function runSetup(){
  const ta = $('#setupCode'), outBox = $('#setupOut'), pre = outBox.querySelector('pre'), btn = $('#setupRunBtn');
  outBox.classList.add('show'); pre.classList.remove('err'); pre.textContent = '⏳ running…';
  btn.disabled = true;
  const res = await runPython(ta.value);
  pre.classList.toggle('err', res.err); pre.textContent = res.text;
  btn.disabled = false;
}

/* ---------------------------------------------------------------------
   8. DATA FOLDER  (mount a real folder → read /data/yourfile.csv)
   --------------------------------------------------------------------- */
async function pickDataFolder(){
  if(!('showDirectoryPicker' in window)){ return pickDataFiles(); }  // Brave/Firefox/Safari: copy files into /data instead
  if(state.dataDirHandle && !state.dataMounted){        // re-grant & mount the saved folder in one click
    if(await mountDataFolder(state.dataDirHandle, true)) return;
  }
  let dir;
  try{ dir = await window.showDirectoryPicker(); }catch(e){ return; }
  state.dataDirHandle = dir;
  try{ await idbSet('dataDir', dir); }catch(_){}
  await mountDataFolder(dir, true);
}
async function mountDataFolder(dir, announce){
  if(!dir) return false;
  try{
    if(await dir.queryPermission({mode:'read'}) !== 'granted'){
      if(await dir.requestPermission({mode:'read'}) !== 'granted'){ if(announce) toast('Folder permission denied'); return false; }
    }
  }catch(_){}
  let py; try{ py = await ensurePyodide(); }catch(e){ return false; }
  try{ py.FS.unmount('/data'); }catch(_){}
  try{ await py.mountNativeFS('/data', dir); }
  catch(e){ try{ py.FS.mkdirTree('/data'); await py.mountNativeFS('/data', dir); }
            catch(e2){ if(announce) toast('Mount failed: ' + e2.message); return false; } }
  state.dataMounted = dir.name;
  const b = $('#dataBtn'); if(b){ b.textContent = '📁 ' + dir.name; b.title = 'Mounted "' + dir.name + '" at /data · click to change folder'; }
  if(announce) toast('Mounted “' + dir.name + '” → read with pd.read_csv("/data/yourfile.csv")');
  return true;
}
/* Fallback for browsers without showDirectoryPicker (Brave, Firefox, Safari):
   pick files through a normal input and copy them into Pyodide's /data. */
function pickDataFiles(){ const inp = $('#dataFiles'); if(inp) inp.click(); }
async function loadDataFiles(e){
  const files = [...e.target.files]; if(!files.length) return;
  let py; try{ py = await ensurePyodide(); }catch(_){ toast('Could not start Python'); return; }
  try{ py.FS.mkdirTree('/data'); }catch(_){}
  let n = 0;
  for(const f of files){
    try{ py.FS.writeFile('/data/' + f.name, new Uint8Array(await f.arrayBuffer())); n++; }
    catch(err){ toast('Failed to load ' + f.name + ': ' + err.message); }
  }
  e.target.value = '';                       // allow re-picking the same file later
  if(!n) return;
  state.dataMounted = n + ' file' + (n===1?'':'s');
  const b = $('#dataBtn'); if(b){ b.textContent = '📁 ' + n + ' file' + (n===1?'':'s'); b.title = 'Loaded ' + n + ' file(s) into /data · click to add more (cleared on reload)'; }
  toast('Loaded ' + n + ' file' + (n===1?'':'s') + ' → read with pd.read_csv("/data/yourfile.csv")');
}
async function autoMountData(py){
  const dir = state.dataDirHandle; if(!dir || state.dataMounted) return;
  try{
    if(await dir.queryPermission({mode:'read'}) !== 'granted') return; // needs a click; leave it to the Data button
    try{ py.FS.unmount('/data'); }catch(_){}
    try{ await py.mountNativeFS('/data', dir); }
    catch(e){ try{ py.FS.mkdirTree('/data'); await py.mountNativeFS('/data', dir); }catch(_){} }
    state.dataMounted = dir.name;
    const b = $('#dataBtn'); if(b){ b.textContent = '📁 ' + dir.name; b.title = 'Mounted "' + dir.name + '" at /data'; }
  }catch(_){}
}

   9. ADD / EDIT FORM

function openForm(id){
  state.editing = id || null;
  const fn = id ? state.library.functions.find(f=>f.id===id) : null;
  $('#formTitle').textContent = fn ? 'Edit function' : 'New function';
  $('#f_name').value = fn?.name || '';
  $('#f_category').value = fn?.category || '';
  $('#f_syntax').value = fn?.syntax || '';
  $('#f_desc').value = fn?.desc || '';
  $('#f_keywords').value = (fn?.keywords||[]).join(', ');
  state.formExamples = (fn?.examples || [{code:'', note:''}]).map(e=>({code:e.code||'', note:e.note||''}));
  $('#deleteFnBtn').style.display = fn ? 'inline-flex' : 'none';
  $('#formError').textContent = '';
  const cats = Array.from(new Set(state.library.functions.map(f=>f.category).filter(Boolean))).sort();
  $('#catList').innerHTML = cats.map(c=>`<option value="${esc(c)}">`).join('');
  renderExampleEditors();
  $('#formOverlay').classList.add('show');
  setTimeout(()=>$('#f_name').focus(), 30);
}
function closeForm(){ $('#formOverlay').classList.remove('show'); state.editing=null; }

function renderExampleEditors(){
  const wrap = $('#exEditors');
  wrap.innerHTML = state.formExamples.map((ex,i)=>`
    <div class="ex-editor" data-i="${i}">
      <div class="ex-editor-head">
        <span>Example ${i+1}</span>
        <button class="btn tiny danger" type="button" data-delex="${i}" ${state.formExamples.length<=1?'style="display:none"':''}>Remove</button>
      </div>
      <div class="field" style="margin-bottom:8px">
        <input type="text" data-note="${i}" placeholder="Optional note for this example (what it shows)" value="${esc(ex.note)}">
      </div>
      <textarea class="code-in" data-code="${i}" rows="4" placeholder="Your example code…" spellcheck="false" style="width:100%; padding:8px 10px; border:1px solid var(--border-strong); border-radius:7px; font-size:13px; line-height:1.5; tab-size:4">${esc(ex.code)}</textarea>
    </div>`).join('');
  wrap.querySelectorAll('[data-code]').forEach(ta=>{
    ta.addEventListener('input', ()=>{ state.formExamples[+ta.dataset.code].code = ta.value; });
    ta.addEventListener('keydown', e=>{ if(e.key==='Tab'){ e.preventDefault(); const s=ta.selectionStart,en=ta.selectionEnd; ta.value=ta.value.slice(0,s)+'    '+ta.value.slice(en); ta.selectionStart=ta.selectionEnd=s+4; state.formExamples[+ta.dataset.code].code=ta.value; }});
  });
  wrap.querySelectorAll('[data-note]').forEach(inp=>{
    inp.addEventListener('input', ()=>{ state.formExamples[+inp.dataset.note].note = inp.value; });
  });
  wrap.querySelectorAll('[data-delex]').forEach(btn=>{
    btn.onclick = ()=>{ state.formExamples.splice(+btn.dataset.delex,1); renderExampleEditors(); };
  });
}

function saveFn(){
  const name = $('#f_name').value.trim();
  if(!name){ $('#formError').textContent = 'A function name is required.'; return; }
  const examples = state.formExamples
    .map(e=>({code:(e.code||'').replace(/\s+$/,''), note:(e.note||'').trim()}))
    .filter(e=>e.code || e.note);
  const payload = {
    name,
    category: $('#f_category').value.trim() || 'Uncategorised',
    syntax: $('#f_syntax').value.replace(/\s+$/,''),
    desc: $('#f_desc').value.trim(),
    keywords: $('#f_keywords').value.split(',').map(s=>s.trim()).filter(Boolean),
    examples,
    updatedAt: Date.now(),
  };
  if(state.editing){
    const fn = state.library.functions.find(f=>f.id===state.editing);
    Object.assign(fn, payload);
    state.currentId = fn.id;
  } else {
    const fn = Object.assign({ id: uid(), createdAt: Date.now() }, payload);
    state.library.functions.push(fn);
    state.currentId = fn.id;
  }
  scheduleSave(); closeForm(); renderAll();
  toast(state.editing ? 'Updated' : 'Added ' + name);
}

function deleteFn(){
  if(!state.editing) return;
  const fn = state.library.functions.find(f=>f.id===state.editing);
  if(!confirm('Delete "'+fn.name+'"? This cannot be undone.')) return;
  state.library.functions = state.library.functions.filter(f=>f.id!==state.editing);
  state.currentId = state.library.functions[0]?.id || null;
  scheduleSave(); closeForm(); renderAll();
  toast('Deleted');
}

/* ---------------------------------------------------------------------
   10. CATEGORY RENAME
   --------------------------------------------------------------------- */
function renameCategory(oldCat){
  const input = prompt('Rename category:', oldCat);
  if(input === null) return;                 // cancelled
  const name = input.trim();
  if(!name || name === oldCat) return;
  let n = 0;
  state.library.functions.forEach(f=>{
    if((f.category?.trim() || 'Uncategorised') === oldCat){ f.category = name; n++; }
  });
  if(state.collapsed[oldCat] !== undefined){ state.collapsed[name] = state.collapsed[oldCat]; delete state.collapsed[oldCat]; }
  scheduleSave(); renderAll();
  toast('Renamed to “' + name + '” (' + n + ' function' + (n===1?'':'s') + ')');
}

/* ---------------------------------------------------------------------
   11. TOP-LEVEL RENDER + EVENTS
   --------------------------------------------------------------------- */
function renderAll(){ renderSidebar(); renderContent(); renderSetup(); }

function wireEvents(){
  $('#search').addEventListener('input', renderSidebar);

  $('#sidebar').addEventListener('click', e=>{
    if(e.target.closest('#collapseAll')){
      const cats = Array.from(new Set(state.library.functions.map(f => f.category?.trim() || 'Uncategorised')));
      const allCollapsed = cats.length > 0 && cats.every(c => state.collapsed[c]);
      cats.forEach(c => { state.collapsed[c] = !allCollapsed; });   // all collapsed → expand, else collapse
      renderSidebar();
      return;
    }
    const ren = e.target.closest('[data-rename]');
    if(ren){ e.stopPropagation(); renameCategory(ren.dataset.rename); return; }
    const item = e.target.closest('.fn-item');
    if(item){ state.currentId = item.dataset.id; renderAll(); $('#content').scrollTop = 0; return; }
    const head = e.target.closest('.cat-header');
    if(head){ const cat = head.dataset.cat; state.collapsed[cat] = !state.collapsed[cat]; renderSidebar(); }
  });

  $('#addBtn').onclick = ()=>openForm();
  $('#dataBtn').onclick = pickDataFolder;
  $('#dataFiles').onchange = loadDataFiles;
  $('#fileBtn').onclick = (e)=>fileMenu(e.currentTarget);

  // setup dropdown (in the top ribbon)
  $('#setupBtn').onclick = (e)=>{ e.stopPropagation(); toggleSetupDropdown(e.currentTarget); };
  $('#setupRunBtn').onclick = ()=>runSetup();
  $('#setupCode').addEventListener('input', ()=>{ const ta=$('#setupCode'); state.library.setup = ta.value; autosize(ta); scheduleSave(); });
  $('#setupCode').addEventListener('keydown', e=>{
    const ta = e.target;
    if(e.key==='Enter' && (e.ctrlKey||e.metaKey)){ e.preventDefault(); runSetup(); }
    if(e.key==='Tab'){ e.preventDefault(); const s=ta.selectionStart,en=ta.selectionEnd; ta.value=ta.value.slice(0,s)+'    '+ta.value.slice(en); ta.selectionStart=ta.selectionEnd=s+4; state.library.setup=ta.value; }
  });

  // form
  $('#saveFnBtn').onclick = saveFn;
  $('#deleteFnBtn').onclick = deleteFn;
  $('#addExampleBtn').onclick = ()=>{ state.formExamples.push({code:'',note:''}); renderExampleEditors(); };
  $$('[data-close-form]').forEach(b=> b.onclick = closeForm);
  $('#formOverlay').addEventListener('mousedown', e=>{ if(e.target.id==='formOverlay') closeForm(); });

  // keyboard
  document.addEventListener('keydown', e=>{
    if(e.key==='/' && document.activeElement.tagName!=='INPUT' && document.activeElement.tagName!=='TEXTAREA'){
      e.preventDefault(); $('#search').focus(); $('#search').select();
    }
    if(e.key==='Escape'){ closeForm(); }
  });
}

// Minimal popup menu for the Library button.
function fileMenu(anchor){
  const existing = document.getElementById('fileMenu'); if(existing){ existing.remove(); return; }
  const m = document.createElement('div');
  m.id='fileMenu';
  m.style.cssText = 'position:absolute; z-index:60; background:#fff; border:1px solid var(--border-strong); border-radius:9px; box-shadow:0 8px 28px rgba(0,0,0,.16); padding:6px; min-width:220px; font-size:13px';
  const r = anchor.getBoundingClientRect();
  m.style.top = (r.bottom+6)+'px'; m.style.left = Math.max(8, r.right-220)+'px';
  const opt = (label, sub, fn)=>{
    const b = document.createElement('button');
    b.className='btn subtle'; b.style.cssText='width:100%; justify-content:flex-start; text-align:left; padding:8px 10px; flex-direction:column; align-items:flex-start; gap:1px';
    b.innerHTML = `<span style="font-weight:600">${label}</span>${sub?`<span style="color:var(--faint); font-size:11.5px">${sub}</span>`:''}`;
    b.onclick = ()=>{ m.remove(); fn(); };
    return b;
  };
  if(canFS){
    m.appendChild(opt('📂 Open library file…','Load an existing .json', openLibraryFile));
    m.appendChild(opt('✚ New library file…','Create & auto-save to disk', newLibraryFile));
    m.appendChild(opt('⬇ Export a copy','Download current data', exportLibrary));
  } else {
    m.appendChild(opt('📂 Import library…','Load a .json from disk', openLibraryFile));
    m.appendChild(opt('⬇ Export / Save','Download your library as .json', exportLibrary));
    const note=document.createElement('div'); note.style.cssText='color:var(--faint); font-size:11px; padding:6px 10px'; note.textContent='This browser cannot auto-save to disk. Use Chrome/Edge for auto-save.'; m.appendChild(note);
  }
  document.body.appendChild(m);
  setTimeout(()=>{ const off=(ev)=>{ if(!m.contains(ev.target) && ev.target!==anchor){ m.remove(); document.removeEventListener('mousedown', off);} }; document.addEventListener('mousedown', off); },0);
}

/* ---------------------------------------------------------------------
   12. STARTUP
   --------------------------------------------------------------------- */
async function init(){
  // remember a previously chosen data folder (mounts on first Run, or via the Data button)
  try{ const dh = await idbGet('dataDir'); if(dh){ state.dataDirHandle = dh; const b=$('#dataBtn'); if(b) b.title='Data folder “'+dh.name+'” set — mounts on first Run, or click to re-grant'; } }catch(_){}

  wireEvents();

  const restored = await tryRestoreHandle();
  if(!restored){
    try{
      const backup = JSON.parse(localStorage.getItem(LS_KEY)||'null');
      if(backup && Array.isArray(backup.functions) && backup.functions.length){
        state.library = Object.assign({language:'python',version:1,functions:[],setup:''}, backup);
        state.currentId = backup.functions[0].id;
        setFileStatus('unsaved', canFS ? 'Restored from browser — open a file to save to disk' : 'Restored from browser backup');
      } else {
        setFileStatus('none','No library file');
      }
    }catch(_){ setFileStatus('none','No library file'); }
  }
  renderAll();
}
window.addEventListener('DOMContentLoaded', init);

// handlers used from inline onclick
window.openForm = openForm;
window.openLibraryFile = openLibraryFile;
</script>
